<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解包资源查看器 · Azur Lane</title>
<style>
  :root{
    /* ===== 色阶（海军深海 + 黄铜）===== */
    --abyss:#081420;      /* 最深海 */
    --deep:#0d1f30;       /* 深海背景 */
    --panel:#112a3f;      /* 面板/卡片底 */
    --steel:#16344a;      /* 钢青 */
    --wave:#1d4d63;       /* 波纹 */
    --foam:#8fb9c7;       /* 泡沫灰蓝（次要文字）*/
    --foam-dim:#5f8394;   /* 更弱的次要文字 */
    --brass:#d8a24a;      /* 黄铜（主强调）*/
    --brass-lit:#f0c063;  /* 亮铜 */
    --brass-dim:rgba(216,162,74,.14);
    --ivory:#eef3f2;      /* 象牙白（主文字）*/
    --line:rgba(143,185,199,.14);
    --line-lit:rgba(143,185,199,.30);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;

    /* ===== 间距比例尺 ===== */
    --s1:.35rem; --s2:.6rem; --s3:.9rem; --s4:1.3rem; --s5:1.9rem; --s6:2.6rem;
    /* ===== 圆角 ===== */
    --r1:4px; --r2:7px; --r3:11px; --r-pill:999px;
    /* ===== 阴影（分层深度）===== */
    --sh1:0 1px 3px rgba(0,0,0,.3);
    --sh2:0 6px 18px rgba(0,0,0,.35);
    --sh3:0 16px 40px rgba(0,0,0,.5);
    --glow:0 0 0 1px var(--brass),0 8px 24px rgba(216,162,74,.18);
    /* ===== 字号阶 ===== */
    --fx1:.62rem; --fx2:.72rem; --fx3:.82rem; --fx4:1rem; --fx5:1.28rem; --fx6:1.7rem;
    /* ===== 布局 ===== */
    --page-x:clamp(1rem,3.5vw,2.6rem);
    --header-h:66px;
    --ease:cubic-bezier(.4,.14,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1300px 760px at 82% -12%, rgba(29,77,99,.38), transparent 60%),
      radial-gradient(1000px 640px at -5% 108%, rgba(216,162,74,.09), transparent 55%),
      var(--abyss);
    background-attachment:fixed;
    color:var(--ivory);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  /* 滚动条（深海风）*/
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--steel);border-radius:var(--r-pill);border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--wave)}
  ::selection{background:var(--brass);color:var(--abyss)}
  /* 通用工具：细描边小标签 */
  .kicker{font-family:var(--mono);font-size:var(--fx1);letter-spacing:.22em;color:var(--foam-dim);text-transform:uppercase}
  /* 顶栏 */
  header{
    display:flex;align-items:center;gap:var(--s4);
    padding:0 var(--page-x);height:var(--header-h);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, rgba(8,20,32,.94), rgba(8,20,32,.78));
    backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:var(--s3)}
  .home-link{
    font-family:var(--mono);font-size:var(--fx2);letter-spacing:.22em;color:var(--brass);
    border:1px solid var(--brass);padding:.32rem .6rem;border-radius:var(--r1);
    text-transform:uppercase;text-decoration:none;transition:.2s var(--ease);white-space:nowrap;
  }
  .home-link:hover{background:var(--brass);color:var(--abyss)}
  .brand .mark{
    font-family:var(--mono);font-size:var(--fx2);letter-spacing:.3em;
    color:var(--brass);border:1px solid var(--brass);
    padding:.32rem .55rem;border-radius:var(--r1);text-transform:uppercase;
    box-shadow:inset 0 0 12px rgba(216,162,74,.12);
  }
  .brand h1{font-size:var(--fx4);font-weight:600;letter-spacing:.02em;line-height:1.15}
  .brand h1 small{display:block;font-family:var(--mono);font-size:var(--fx1);
    color:var(--foam-dim);letter-spacing:.2em;margin-top:.28rem;font-weight:400}
  .tabs{margin-left:auto;display:flex;gap:var(--s1);background:rgba(0,0,0,.2);
    padding:.28rem;border-radius:var(--r2);border:1px solid var(--line)}
  .tab{
    font-family:var(--mono);font-size:var(--fx3);letter-spacing:.08em;
    background:none;border:none;color:var(--foam);
    padding:.5rem 1.05rem;border-radius:var(--r1);cursor:pointer;
    transition:.2s var(--ease);position:relative;
  }
  .tab:hover{color:var(--ivory)}
  .tab.on{color:var(--abyss);background:var(--brass);font-weight:600;box-shadow:var(--sh1)}

  main{padding:0}
  .view{display:none}
  .view.on{display:block}

  /* ===== Live2D 视图 ===== */
  #live2d-view{display:none}
  #live2d-view.on{display:block}
  /* Live2D 卡片网格视图 */
  #l2d-grid-view{padding:var(--s5) var(--page-x) var(--s6)}
  /* Live2D 操作台视图 */
  #l2d-stage-view{height:calc(100vh - var(--header-h));position:relative}

  /* ===== 工具栏（标题 + 计数 + 搜索/排序/筛选）===== */
  .toolbar{
    display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
    margin-bottom:var(--s5);padding-bottom:var(--s3);
    border-bottom:1px solid var(--line);
  }
  .toolbar .th{display:flex;align-items:baseline;gap:var(--s3)}
  .toolbar h2{font-size:var(--fx5);font-weight:600;letter-spacing:.02em}
  .toolbar .count{
    font-family:var(--mono);font-size:var(--fx2);color:var(--foam-dim);
    letter-spacing:.1em;padding:.2rem .55rem;border:1px solid var(--line);
    border-radius:var(--r-pill);white-space:nowrap;
  }
  .toolbar .controls{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
  .search{
    font-family:var(--mono);font-size:var(--fx3);
    background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--ivory);
    padding:.55rem .85rem;border-radius:var(--r2);outline:none;min-width:240px;
    transition:.2s var(--ease);
  }
  .search:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-dim)}
  .search::placeholder{color:var(--foam-dim)}
  .sortsel{
    font-family:var(--mono);font-size:var(--fx2);letter-spacing:.04em;
    background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--foam);
    padding:.55rem .7rem;border-radius:var(--r2);outline:none;cursor:pointer;
    transition:.2s var(--ease);
  }
  .sortsel:hover{border-color:var(--line-lit);color:var(--ivory)}
  .sortsel:focus{border-color:var(--brass)}

  .back-btn{
    position:absolute;top:var(--s4);left:var(--s4);z-index:6;
    font-family:var(--mono);font-size:var(--fx3);letter-spacing:.06em;
    background:rgba(13,31,48,.85);border:1px solid var(--line);color:var(--foam);
    padding:.55rem 1rem;border-radius:var(--r2);cursor:pointer;
    backdrop-filter:blur(8px);transition:.2s var(--ease);
  }
  .back-btn:hover{border-color:var(--brass);color:var(--brass-lit);transform:translateX(-2px)}
  .stage{position:relative;overflow:hidden;height:100%}
  #canvas-wrap{position:absolute;inset:0}
  canvas{display:block;width:100%;height:100%}
  .stage-hint{
    position:absolute;left:var(--s4);bottom:var(--s4);font-family:var(--mono);
    font-size:var(--fx2);letter-spacing:.08em;color:var(--foam-dim);
    pointer-events:none;line-height:1.8;
  }
  .stage-hint b{color:var(--brass);font-weight:600}
  .loading{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--mono);font-size:var(--fx3);letter-spacing:.2em;color:var(--foam);
  }
  .loading::after{content:"";width:34px;height:34px;margin-left:14px;
    border:2px solid var(--line);border-top-color:var(--brass);
    border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== 立绘画廊 ===== */
  #gallery-view{padding:var(--s5) var(--page-x) var(--s6)}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:var(--s4);
  }
  .card{
    background:
      linear-gradient(180deg,rgba(22,52,74,.45),rgba(13,31,48,.25)),
      repeating-conic-gradient(#0f2436 0% 25%, #12293c 0% 50%) 50%/24px 24px;
    border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;
    cursor:pointer;position:relative;box-shadow:var(--sh1);
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
  }
  .card:hover{border-color:var(--line-lit);transform:translateY(-4px);box-shadow:var(--sh3)}
  .card:active{transform:translateY(-1px)}
  .card .thumb{aspect-ratio:4/5;display:grid;place-items:center;padding:var(--s3);position:relative;overflow:hidden;min-height:0}
  /* hover 时图片轻微放大 */
  .card img{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));
    transition:transform .3s var(--ease)}
  .card:hover img{transform:scale(1.04)}
  /* 信息区：主名称弱化为 mono 小字，英文名为主标题 */
  .card .info{padding:.7rem .8rem .8rem;border-top:1px solid var(--line);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.15))}
  .card .en{
    font-family:var(--sans);font-size:var(--fx3);font-weight:600;color:var(--ivory);
    letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
  }
  .card .name{
    font-family:var(--mono);font-size:var(--fx1);letter-spacing:.05em;
    color:var(--foam-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.2rem;
  }
  .card .name.solo{font-size:var(--fx2);color:var(--foam)}  /* 无英文名时名称当主标题 */
  .card .badge{
    position:absolute;top:.55rem;right:.55rem;font-family:var(--mono);
    font-size:var(--fx1);letter-spacing:.06em;color:var(--abyss);background:var(--brass);
    padding:.16rem .42rem;border-radius:var(--r1);font-weight:700;box-shadow:var(--sh1);
  }
  .card .vbadge{
    position:absolute;top:.55rem;left:.55rem;font-family:var(--mono);
    font-size:var(--fx1);letter-spacing:.06em;color:var(--brass-lit);
    background:rgba(8,20,32,.82);border:1px solid var(--line-lit);
    padding:.16rem .42rem;border-radius:var(--r1);font-weight:600;backdrop-filter:blur(4px);
  }
  /* 皮肤数角标（立绘卡右上，说明该皮肤组含几张图）*/
  .card .cbadge{
    position:absolute;top:.55rem;right:.55rem;font-family:var(--mono);
    font-size:var(--fx1);letter-spacing:.04em;color:var(--abyss);background:var(--brass);
    min-width:1.4rem;text-align:center;
    padding:.16rem .4rem;border-radius:var(--r1);font-weight:700;box-shadow:var(--sh1);
  }
  /* 角色详情面板 */
  .detail{
    position:fixed;inset:0;z-index:45;display:none;
    background:rgba(4,10,16,.86);backdrop-filter:blur(10px);padding:var(--s5);
  }
  .detail.on{display:grid;place-items:center}
  .detail-panel{
    width:min(1200px,94vw);max-height:90vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--deep),var(--abyss));
    border:1px solid var(--line-lit);border-radius:var(--r3);overflow:hidden;
    box-shadow:var(--sh3);
  }
  .detail-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);
    padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.2);
  }
  .detail-title{font-size:var(--fx5);font-weight:600;color:var(--ivory);line-height:1.2}
  .detail-sub{font-family:var(--mono);font-size:var(--fx2);color:var(--foam-dim);letter-spacing:.1em;margin-top:.35rem}
  .detail-grid{
    padding:var(--s5);overflow-y:auto;display:grid;gap:var(--s4);
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  }
  .close{font-family:var(--mono);font-size:var(--fx3);color:var(--foam);cursor:pointer;
    border:1px solid var(--line);padding:.45rem .85rem;border-radius:var(--r2);letter-spacing:.1em;
    white-space:nowrap;transition:.2s var(--ease);background:rgba(0,0,0,.2)}
  .close:hover{border-color:var(--brass);color:var(--brass-lit)}
  /* 灯箱 */
  .lightbox{
    position:fixed;inset:0;z-index:60;display:none;place-items:center;
    background:rgba(4,10,16,.94);backdrop-filter:blur(8px);padding:var(--s6);
  }
  .lightbox.on{display:grid}
  .lightbox img{max-width:90vw;max-height:88vh;object-fit:contain;
    filter:drop-shadow(0 28px 70px rgba(0,0,0,.65))}
  .lightbox .close{position:absolute;top:var(--s4);right:var(--s5)}
  .lightbox .cap{position:absolute;bottom:var(--s5);font-family:var(--mono);
    font-size:var(--fx3);color:var(--brass);letter-spacing:.14em}

  /* ===== 响应式（桌面为主，移动能用）===== */
  @media(max-width:820px){
    .brand h1{font-size:var(--fx3)}
    .brand h1 small{display:none}
    .toolbar .controls{width:100%}
    .toolbar .controls .search{flex:1;min-width:0}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
    .card .thumb{aspect-ratio:4/5}
    .motions{width:150px;top:var(--s2);right:var(--s2)}
  }
  @media(max-width:560px){
    header{gap:var(--s2)}
    .brand .mark{display:none}
    .tab{padding:.45rem .7rem;font-size:var(--fx2)}
    .grid{grid-template-columns:repeat(2,1fr);gap:var(--s2)}
    .card .thumb{aspect-ratio:4/5}
  }
  /* 动作面板：右上角窄抽屉 + 紧凑网格，适合长动作列表 */
  .motions{
    position:absolute;top:var(--s4);right:var(--s4);z-index:5;
    display:flex;flex-direction:column;align-items:flex-end;gap:var(--s2);
    pointer-events:none;
  }
  /* 折叠开关：显示动作数量，点击展开/收起 */
  .motions .m-toggle{
    font-family:var(--mono);font-size:var(--fx2);letter-spacing:.08em;
    background:rgba(8,20,32,.86);border:1px solid var(--line-lit);color:var(--foam);
    padding:.5rem .9rem;border-radius:var(--r2);cursor:pointer;transition:.15s var(--ease);
    backdrop-filter:blur(10px);white-space:nowrap;display:inline-flex;
    align-items:center;gap:.5rem;
    box-shadow:var(--sh2);
    pointer-events:auto;
  }
  .motions .m-toggle:hover{border-color:var(--brass);color:var(--brass-lit)}
  .motions .m-toggle .caret{transition:transform .2s;font-size:.66rem;opacity:.8}
  .motions.open .m-toggle{border-color:var(--brass);color:var(--brass-lit)}
  .motions.open .m-toggle .caret{transform:rotate(180deg)}
  .motions .m-count{
    color:var(--brass);font-weight:600;
    background:rgba(216,162,74,.14);padding:0 .4rem;border-radius:var(--r1);
  }
  /* 展开的按钮网格：窄侧栏，两列 chip，可滚动 */
  .motions .m-list{
    display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:.42rem;
    width:min(360px,calc(100vw - var(--page-x)*2));
    max-height:calc(100vh - var(--header-h) - var(--s4)*3 - 2.6rem);overflow-y:auto;
    padding:.75rem;border-radius:var(--r3);
    background:rgba(8,20,32,.86);border:1px solid var(--line-lit);
    backdrop-filter:blur(12px);box-shadow:var(--sh2);
    pointer-events:auto;
  }
  .motions.open .m-list{display:grid}
  .motions .m-list::-webkit-scrollbar{width:6px}
  .motions .m-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .motions .mgroup{
    grid-column:1/-1;font-family:var(--mono);font-size:var(--fx1);letter-spacing:.16em;
    color:var(--foam-dim);text-transform:uppercase;
    padding:.45rem .25rem .05rem;
  }
  .motions .mbtn{
    font-family:var(--mono);font-size:var(--fx2);letter-spacing:.04em;
    background:rgba(22,52,74,.92);border:1px solid var(--line-lit);color:var(--ivory);
    padding:.4rem .55rem;border-radius:var(--r1);cursor:pointer;transition:.15s var(--ease);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .motions .mbtn:hover{border-color:var(--brass);color:var(--brass-lit);background:rgba(29,77,99,.95)}
  .motions .mbtn.on{background:var(--brass);color:var(--abyss);border-color:var(--brass);font-weight:600;box-shadow:var(--sh1)}
  @media(max-width:720px){
    .motions{top:var(--s2);left:auto;right:var(--s2);bottom:auto;align-items:flex-end}
    .motions .m-toggle{justify-content:center}
    .motions .m-list{width:min(320px,calc(100vw - var(--s2)*2));grid-template-columns:repeat(2,minmax(0,1fr));max-height:70vh}
  }
</style>
</head>
<body>
<header>
  <a class="home-link" href="../../index.html">← 首页</a>
  <div class="brand">
    <span class="mark">UNPACK</span>
    <h1>解包资源查看器<small>AZUR LANE · APK ASSET EXTRACTION</small></h1>
  </div>
  <nav class="tabs">
    <button class="tab on" data-view="live2d-view">Live2D 模型</button>
    <button class="tab" data-view="gallery-view">立绘画廊</button>
  </nav>
</header>

<main>
  <section id="live2d-view" class="view on">
    <!-- Live2D 卡片网格 -->
    <div id="l2d-grid-view">
      <div class="toolbar">
        <div class="th">
          <h2>Live2D 模型</h2>
          <span class="count" id="l2d-count">— 模型</span>
        </div>
        <div class="controls">
          <select class="sortsel" id="ship-sort">
            <option value="new">最新优先</option>
            <option value="old">最旧优先</option>
            <option value="name">名称 A→Z</option>
          </select>
          <select class="sortsel" id="ship-ver">
            <option value="">全部版本</option>
            <option value="1">v1 (3.0)</option>
            <option value="2">v2 (3.3)</option>
            <option value="3">v3 (4.0)</option>
            <option value="4">v4 (4.2)</option>
            <option value="5">v5 (5.0)</option>
          </select>
          <select class="sortsel card-cols" title="每行卡片数"></select>
          <input class="search" id="ship-search" placeholder="搜索舰装 (拼音/英文)…" autocomplete="off">
        </div>
      </div>
      <div class="grid" id="l2d-grid"></div>
      <div id="l2d-sentinel" style="height:40px"></div>
    </div>

    <!-- Live2D 操作台（点卡片进入） -->
    <div id="l2d-stage-view" style="display:none">
      <button class="back-btn" id="l2d-back">← 返回列表</button>
      <div class="stage">
        <div id="canvas-wrap"><canvas id="live2d-canvas"></canvas></div>
        <div class="loading" id="l2d-loading">加载模型</div>
        <div class="motions" id="motion-panel"></div>
        <div class="stage-hint">
          <b>拖拽</b> 平移 · <b>滚轮</b> 缩放 · <b>移动鼠标</b> 视线跟随<br>
          物理与呼吸已还原 · 点击右上角 <b>动作</b> 展开动作列表
        </div>
      </div>
    </div>
  </section>

  <section id="gallery-view" class="view">
    <div class="toolbar">
      <div class="th">
        <h2>角色立绘</h2>
        <span class="count" id="paint-count">— 皮肤</span>
      </div>
      <div class="controls">
        <select class="sortsel" id="paint-sort">
          <option value="new">最新优先</option>
          <option value="old">最旧优先</option>
          <option value="name">名称 A→Z</option>
        </select>
        <select class="sortsel card-cols" title="每行卡片数"></select>
        <input class="search" id="paint-search" placeholder="搜索角色 (拼音/英文)…" autocomplete="off">
      </div>
    </div>
    <div class="grid" id="paint-grid"></div>
    <div id="sentinel" style="height:40px"></div>
  </section>

</main>

<!-- 角色详情：显示该角色全部皮肤/变体/部件 -->

<script>
const { Live2DModel } = PIXI.live2d;
let app, current, manifest;
let loadToken = 0;              // 递增令牌：只让最后一次点击的结果生效
const modelCache = new Map();  // path -> Live2DModel，避免重复加载
const CACHE_MAX = 12;          // 最多缓存模型数，超出销毁最旧的（防内存爆）
const CARD_COLS_KEY = 'azurlane.cardColumns';
const CARD_COL_OPTIONS = [
  ['auto', '自动列数'], ['3', '每行 3 个'], ['4', '每行 4 个'], ['5', '每行 5 个'],
  ['6', '每行 6 个'], ['8', '每行 8 个'], ['10', '每行 10 个'],
];
const MOTION_PRIMARY = [
  'idle','home','main_1','main_2','main_3','main_4','touch_head','touch_body',
  'touch_special','mission','mission_complete','complete','mail','login','wedding',
  'change_in','change_out',
];

const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function cacheModel(path, model){
  modelCache.set(path, model);
  while(modelCache.size > CACHE_MAX){
    const oldestKey = modelCache.keys().next().value;
    const old = modelCache.get(oldestKey);
    modelCache.delete(oldestKey);
    if(old !== current){ try{ old.destroy(); }catch(e){} }
  }
}

async function boot(){
  manifest = await (await fetch('manifest.json')).json();
  setupCardColumns();
  buildL2dGrid();
  buildGallery();
  initPixi();
  enableInteraction();          // 交互只需绑定一次
  setupTabs();
  document.getElementById('l2d-back').onclick = exitStage;
}

function applyCardColumns(value){
  document.querySelectorAll('.grid').forEach(grid => {
    grid.style.gridTemplateColumns = value && value !== 'auto'
      ? `repeat(${value}, minmax(0, 1fr))`
      : '';
  });
}

function setupCardColumns(){
  const saved = localStorage.getItem(CARD_COLS_KEY) || 'auto';
  document.querySelectorAll('.card-cols').forEach(sel => {
    sel.innerHTML = CARD_COL_OPTIONS.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
    sel.value = saved;
    sel.onchange = () => {
      localStorage.setItem(CARD_COLS_KEY, sel.value);
      document.querySelectorAll('.card-cols').forEach(other => { if(other !== sel) other.value = sel.value; });
      applyCardColumns(sel.value);
    };
  });
  applyCardColumns(saved);
}

function cardInfo(primary, secondary){
  return primary
    ? `<div class="info"><div class="en">${escapeHtml(primary)}</div><div class="name">${escapeHtml(secondary)}</div></div>`
    : `<div class="info"><div class="name solo">${escapeHtml(secondary)}</div></div>`;
}

function createCard({img, alt, badge='', leftBadge='', info, onClick}){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="thumb">${badge}${leftBadge}<img loading="lazy" src="${escapeHtml(img)}" alt="${escapeHtml(alt)}"></div>${info}`;
  card.onclick = onClick;
  return card;
}

function debounce(fn, wait=180){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}

function initPixi(){
  const canvas = document.getElementById('live2d-canvas');
  app = new PIXI.Application({
    view: canvas, resizeTo: canvas.parentElement,
    backgroundAlpha: 0, antialias: true, autoDensity: true,
    resolution: window.devicePixelRatio || 1,
  });
}

function sortItems(items, mode){
  const arr = items.slice();
  if(mode === 'name'){
    arr.sort((a,b) => a.name.localeCompare(b.name));
  }else{
    // new: 发布次序降序; old: 升序。
    // 排序键优先用 rel(shop_id 派生的真实上架次序)，缺失时回落到皮肤 id。
    // 皮肤 id = ship_group*10+group_index 只表示舰船编号，不是发布时间，故仅作兜底。
    const dir = mode === 'old' ? 1 : -1;
    const key = x => (x.rel > 0 ? x.rel : (x.id < 0 ? null : x.id));
    const tier = x => (x.rel > 0 ? 0 : (x.id < 0 ? 2 : 1));
    arr.sort((a,b) => {
      const ta = tier(a), tb = tier(b);
      if(ta !== tb) return ta - tb;            // 有 rel 的优先, 无任何信息的垫底
      const av = key(a), bv = key(b);
      if(av === null && bv === null) return a.name.localeCompare(b.name);
      if(av === null) return 1;
      if(bv === null) return -1;
      if(av === bv) return a.name.localeCompare(b.name);
      return (av - bv) * dir;
    });
  }
  return arr;
}

let l2dFiltered = [];
let l2dShown = 0;
const L2D_PAGE = 48;

function buildL2dGrid(){
  const grid = document.getElementById('l2d-grid');
  const models = manifest.models;

  const appendCards = () => {
    const slice = l2dFiltered.slice(l2dShown, l2dShown + L2D_PAGE);
    slice.forEach(m => {
      const gi = manifest.models.indexOf(m);
      const cover = m.cover || '';
      grid.appendChild(createCard({
        img: cover,
        alt: m.name,
        badge: '<span class="badge">L2D</span>',
        leftBadge: m.ver ? `<span class="vbadge">v${escapeHtml(m.ver)}</span>` : '',
        info: cardInfo(m.en, m.name),
        onClick: () => enterStage(gi),
      }));
    });
    l2dShown += slice.length;
  };

  const reset = (items) => {
    l2dFiltered = items;
    l2dShown = 0;
    grid.innerHTML = '';
    appendCards();
    document.getElementById('l2d-count').textContent = `${items.length} 模型`;
  };

  const apply = () => {
    const q = document.getElementById('ship-search').value.trim().toLowerCase();
    const mode = document.getElementById('ship-sort').value;
    const ver = document.getElementById('ship-ver').value;   // '' = 全部
    let items = models;
    if(q) items = items.filter(m => m.name.toLowerCase().includes(q) || (m.en && m.en.toLowerCase().includes(q)));
    if(ver) items = items.filter(m => String(m.ver) === ver);
    reset(sortItems(items, mode));
  };

  new IntersectionObserver((entries) => {
    if(entries[0].isIntersecting && l2dShown < l2dFiltered.length) appendCards();
  }, {rootMargin:'400px'}).observe(document.getElementById('l2d-sentinel'));

  document.getElementById('ship-search').oninput = debounce(apply);
  document.getElementById('ship-sort').onchange = apply;
  document.getElementById('ship-ver').onchange = apply;
  apply();
}

// 进入操作台
function enterStage(i){
  document.getElementById('l2d-grid-view').style.display = 'none';
  document.getElementById('l2d-stage-view').style.display = 'block';
  // stage 之前是 display:none，等浏览器重排后再按真实尺寸 resize，否则画布为 0
  setTimeout(() => {
    const wrap = document.getElementById('canvas-wrap');
    if(wrap.clientWidth > 0){
      app.renderer.resize(wrap.clientWidth, wrap.clientHeight);
    }
    selectShip(i);
  }, 30);
}
// 返回列表
function exitStage(){
  if(current){ app.stage.removeChild(current); current = null; }
  document.getElementById('l2d-stage-view').style.display = 'none';
  document.getElementById('l2d-grid-view').style.display = 'block';
}

// 预下载模型的 moc3 + 贴图，回调下载百分比。下载后浏览器缓存变热，Live2DModel.from 从缓存读。
async function preloadModel(model3Path, onProgress){
  const base = model3Path.slice(0, model3Path.lastIndexOf('/') + 1);
  const m3 = await (await fetch(model3Path)).json();
  const refs = m3.FileReferences || {};
  const files = [];
  if(refs.Moc) files.push(base + refs.Moc);
  (refs.Textures || []).forEach(t => files.push(base + t));
  // 先拿各文件大小
  const sizes = await Promise.all(files.map(async f => {
    try{ const h = await fetch(f, {method:'HEAD'}); return +(h.headers.get('content-length')||0); }
    catch(e){ return 0; }
  }));
  const total = sizes.reduce((a,b)=>a+b,0) || 1;
  let loaded = 0;
  // 逐个流式下载，累计进度
  for(let i=0;i<files.length;i++){
    const resp = await fetch(files[i]);
    const reader = resp.body.getReader();
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      loaded += value.length;
      onProgress(Math.min(99, Math.round(loaded / total * 100)));
    }
  }
}

async function selectShip(i){
  const token = ++loadToken;               // 本次加载的令牌
  const path = manifest.models[i].path;
  const loading = document.getElementById('l2d-loading');

  // 从舞台移除当前模型（缓存的不销毁，仅隐藏）
  if(current){ app.stage.removeChild(current); current = null; }

  // 命中缓存：瞬间显示
  if(modelCache.has(path)){
    const cached = modelCache.get(path);
    modelCache.delete(path); modelCache.set(path, cached);  // 刷新 LRU 顺序
    current = cached;
    app.stage.addChild(cached);
    layoutModel(cached);
    buildMotionPanel(cached);
    loading.style.display = 'none';
    return;
  }

  loading.style.display = 'grid';
  loading.textContent = '加载模型…';

  // 预下载贴图/moc3 并显示进度（大模型 20-40MB，让用户知道在加载而非卡死）
  try{
    await preloadModel(path, (pct) => {
      if(token === loadToken) loading.textContent = `加载中 ${pct}%`;
    });
  }catch(e){ /* 预下载失败不阻断，交给 Live2DModel.from 兜底 */ }
  if(token !== loadToken) return;
  loading.textContent = '解析模型…';

  let model;
  try{
    model = await Live2DModel.from(path, { autoInteract:false });
  }catch(e){
    if(token !== loadToken) return;        // 已被更晚的点击取代，忽略
    console.error(e);
    loading.textContent = '加载失败: ' + e.message;
    return;
  }

  // 加载完成时，如果用户已经点了别的模型，丢弃这个结果
  if(token !== loadToken){
    cacheModel(path, model);               // 仍缓存，下次点它就快
    return;
  }

  cacheModel(path, model);
  current = model;
  app.stage.addChild(model);
  layoutModel(model);
  fixSolidMask(model);           // 变身皮肤纯色遮罩修复(仅异常模型触发)
  buildMotionPanel(model);
  loading.style.display = 'none';
}

// 动作面板：折叠开关 + 紧凑网格；按前缀分组（主要/IDLE/TOUCH/其他），点击播放
function buildMotionPanel(model){
  const panel = document.getElementById('motion-panel');
  panel.innerHTML = '';
  panel.classList.remove('open');
  let groups = [];
  try{
    const defs = model.internalModel.settings.motions || {};
    groups = Object.keys(defs);
  }catch(e){ groups = []; }
  if(!groups.length){ return; }

  // 分类：主要 / idle 系列 / touch 系列 / 其他
  const cats = {main:[], idle:[], touch:[], other:[]};
  groups.forEach(g=>{
    if(MOTION_PRIMARY.includes(g)) cats.main.push(g);
    else if(/^idle/i.test(g)) cats.idle.push(g);
    else if(/^touch/i.test(g)) cats.touch.push(g);
    else cats.other.push(g);
  });

  // 主要动作按 primary 顺序；其余按名字自然序
  cats.main.sort((a,b)=>MOTION_PRIMARY.indexOf(a)-MOTION_PRIMARY.indexOf(b));
  const natural = (a,b)=>a.localeCompare(b,undefined,{numeric:true});
  cats.idle.sort(natural); cats.touch.sort(natural); cats.other.sort(natural);

  // 折叠开关
  const toggle = document.createElement('button');
  toggle.className = 'm-toggle';
  toggle.innerHTML = `动作 <span class="m-count">${groups.length}</span><span class="caret">▾</span>`;
  toggle.onclick = () => panel.classList.toggle('open');
  panel.appendChild(toggle);

  // 按钮网格
  const list = document.createElement('div');
  list.className = 'm-list';
  panel.appendChild(list);

  const FORCE = (PIXI.live2d.MotionPriority && PIXI.live2d.MotionPriority.FORCE) || 3;
  const makeBtn = g => {
    const btn = document.createElement('button');
    btn.className = 'mbtn';
    btn.textContent = g;
    btn.title = g;
    btn.onclick = () => {
      list.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('on'));
      btn.classList.add('on');
      try{ model.motion(g, 0, FORCE); }   // FORCE：立即打断当前动作
      catch(e){ console.error('motion', g, e); }
    };
    return btn;
  };
  const addGroup = (label, arr) => {
    if(!arr.length) return;
    const h = document.createElement('div');
    h.className = 'mgroup';
    h.textContent = `${label} · ${arr.length}`;
    list.appendChild(h);
    arr.forEach(g => list.appendChild(makeBtn(g)));
  };
  addGroup('主要', cats.main);
  addGroup('IDLE', cats.idle);
  addGroup('TOUCH', cats.touch);
  addGroup('其他', cats.other);

  // 动作自然播放结束(非被打断)时，熄灭高亮。先移除旧监听避免缓存复用时重复绑定。
  try{
    const mm = model.internalModel.motionManager;
    mm.off('motionFinish');
    mm.on('motionFinish', () => {
      list.querySelectorAll('.mbtn.on').forEach(x=>x.classList.remove('on'));
    });
  }catch(e){}
}

// 部分"变身皮肤"模型(mojiaduoer_4 / wuqi_3 等)默认静止态有一个 order 最高、
// 覆盖全屏的 ArtMesh 遮罩层(变身过场用)，op=1 盖住整个角色 => 画面纯色铺满。
// 通用修复：渲染一帧后检测是否纯色，若是则从最上层起隐藏"覆盖画面中心的大 drawable"，
// 直到画面不再纯色。每帧在 update 后把这些 drawable 的 opacity 清零。
// 经全部 259 模型验证：仅 mojiaduoer_4 / wuqi_3 / wuqi_3_hx 触发，无误伤。
function sampleSolid(){
  const gl = app.renderer.gl, W = app.renderer.width, H = app.renderer.height;
  const px = new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  let opaque=0; const buckets=new Map(); const step=8;
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step){
    const i=(y*W+x)*4; if(px[i+3]<40) continue; opaque++;
    const k=(px[i]>>4)+','+(px[i+1]>>4)+','+(px[i+2]>>4);
    buckets.set(k,(buckets.get(k)||0)+1);
  }
  let top=0; for(const v of buckets.values()) if(v>top) top=v;
  const cells=Math.ceil(W/step)*Math.ceil(H/step);
  const topRatio = opaque ? top/opaque : 0;
  const coverage = opaque/cells;
  return topRatio>0.85 && coverage>0.6;   // 单一色占比极高且铺满 => 纯色异常
}
function fullscreenMaskCandidates(core){
  const n=core.getDrawableCount(), ids=core.getDrawableIds();
  const orders=core.getDrawableRenderOrders(), cands=[];
  for(let i=0;i<n;i++){
    if(core.getDrawableOpacity(i)<0.5) continue;
    if(!core.getDrawableDynamicFlagIsVisible(i)) continue;
    const vp=core.getDrawableVertexPositions(i);
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(let k=0;k<vp.length;k+=2){const x=vp[k],y=vp[k+1];
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;}
    // 覆盖画面中心(跨原点) 且 又宽又高(远大于普通部件)
    if(x0<0&&x1>0&&y0<0&&y1>0&&(x1-x0)>50&&(y1-y0)>50)
      cands.push({i, order:orders[i]});
  }
  cands.sort((a,b)=>b.order-a.order);   // 最顶层先隐藏
  return cands;
}
function fixSolidMask(model){
  let core;
  try{ core = model.internalModel.coreModel; }catch(e){ return; }
  if(!core || !core._model || !core._model.drawables) return;
  app.render();
  if(!sampleSolid()) return;             // 正常模型直接跳过
  const ops = core._model.drawables.opacities;   // Float32Array (heap view)
  const cands = fullscreenMaskCandidates(core);
  const hidden = [];
  for(const c of cands){
    hidden.push(c.i);
    ops[c.i] = 0;
    app.render();
    if(!sampleSolid()) break;
    if(hidden.length >= 6) break;        // 防呆上限
  }
  if(!hidden.length) return;
  // 每帧 update 后持续把这些遮罩层清零(否则动作/物理会把它们改回来)
  const im = model.internalModel;
  const orig = im.update.bind(im);
  im.update = function(dt, now){ orig(dt, now); for(const i of hidden) ops[i]=0; };
}

function layoutModel(model){
  const W = app.renderer.width / (window.devicePixelRatio||1);
  const H = app.renderer.height / (window.devicePixelRatio||1);
  const scale = Math.min(W / model.width, H / model.height) * 0.8;   // 默认 80% 画布
  model.scale.set(scale);
  model.anchor.set(0.5, 0.5);
  model.position.set(W/2, H/2);
  model._baseScale = scale;
}

// 平移 / 缩放 / 视线跟随（只绑定一次，始终操作当前模型 current）
let interactionReady = false;
function enableInteraction(){
  if(interactionReady) return;
  interactionReady = true;
  const stage = app.view.parentElement;
  let drag=false, lx=0, ly=0;
  stage.onpointerdown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
  window.addEventListener('pointerup', ()=> drag=false);
  stage.onpointermove = e => {
    if(!current) return;
    if(drag){ current.x += e.clientX-lx; current.y += e.clientY-ly; lx=e.clientX; ly=e.clientY; }
    const r = stage.getBoundingClientRect();
    current.focus(e.clientX - r.left, e.clientY - r.top);
  };
  stage.onwheel = e => {
    e.preventDefault();
    if(!current) return;
    const f = e.deltaY < 0 ? 1.06 : 0.94;
    current.scale.set(current.scale.x * f);
  };
}

let charFiltered = [];
let charShown = 0;
const PAGE = 48;


function sortChars(items, mode){
  const arr = items.slice();
  if(mode === 'name'){
    arr.sort((a,b) => a.rep.localeCompare(b.rep));
  }else{
    // 同 sortItems: 优先按 rel(真实上架次序), 无则回落皮肤 id
    const dir = mode === 'old' ? 1 : -1;
    const key = x => (x.rel > 0 ? x.rel : (x.skin < 0 ? null : x.skin));
    const tier = x => (x.rel > 0 ? 0 : (x.skin < 0 ? 2 : 1));
    arr.sort((a,b) => {
      const ta = tier(a), tb = tier(b);
      if(ta !== tb) return ta - tb;
      const av = key(a), bv = key(b);
      if(av === null && bv === null) return a.rep.localeCompare(b.rep);
      if(av === null) return 1;
      if(bv === null) return -1;
      if(av === bv) return a.rep.localeCompare(b.rep);
      return (av - bv) * dir;
    });
  }
  return arr;
}

function buildGallery(){
  const grid = document.getElementById('paint-grid');
  const chars = manifest.characters;

  const appendCards = () => {
    const slice = charFiltered.slice(charShown, charShown + PAGE);
    slice.forEach(c => grid.appendChild(createCard({
      img: c.rep_path,
      alt: c.rep,
      badge: c.items.length > 1 ? `<span class="cbadge">${c.items.length}</span>` : '',
      info: cardInfo(c.en, c.rep),
      onClick: () => openDetail(c),
    })));
    charShown += slice.length;
  };

  const reset = (items) => {
    charFiltered = items;
    charShown = 0;
    grid.innerHTML = '';
    appendCards();
    const totalImgs = items.reduce((s,c)=>s+c.items.length,0);
    document.getElementById('paint-count').textContent = `${items.length} 皮肤 · ${totalImgs} 张`;
  };

  const apply = () => {
    const q = document.getElementById('paint-search').value.trim().toLowerCase();
    const mode = document.getElementById('paint-sort').value;
    let items = chars;
    if(q){
      items = chars.filter(c =>
        c.rep.toLowerCase().includes(q) ||
        (c.en && c.en.toLowerCase().includes(q)) ||
        c.items.some(it => it.name.toLowerCase().includes(q))
      );
    }
    reset(sortChars(items, mode));
  };

  new IntersectionObserver((entries) => {
    if(entries[0].isIntersecting && charShown < charFiltered.length) appendCards();
  }, {rootMargin:'400px'}).observe(document.getElementById('sentinel'));

  document.getElementById('paint-search').oninput = debounce(apply);
  document.getElementById('paint-sort').onchange = apply;
  apply();
}

function openDetail(c){
  document.getElementById('detail-title').textContent = c.en || c.rep;
  document.getElementById('detail-sub').textContent =
    `${c.rep}　·　${c.items.length} 张`;
  const grid = document.getElementById('detail-grid');
  grid.innerHTML = '';
  c.items.forEach(it => {
    const kindLabel = {main:'默认', variant:'换装', part:'部件'}[it.kind] || '';
    grid.appendChild(createCard({
      img: it.path,
      alt: it.name,
      leftBadge: kindLabel ? `<span class="vbadge">${kindLabel}</span>` : '',
      info: cardInfo('', it.name),
      onClick: () => openLightbox(it),
    }));
  });
  document.getElementById('detail').classList.add('on');
}
document.getElementById('detail-close').onclick =
document.getElementById('detail').onclick = e => {
  if(e.target.id === 'detail' || e.target.id === 'detail-close')
    document.getElementById('detail').classList.remove('on');
};

function openLightbox(p){
  document.getElementById('lb-img').src = p.path;
  document.getElementById('lb-cap').textContent = p.name;
  document.getElementById('lightbox').classList.add('on');
}
document.getElementById('lb-close').onclick =
document.getElementById('lightbox').onclick = e => {
  if(e.target.id==='lightbox' || e.target.id==='lb-close')
    document.getElementById('lightbox').classList.remove('on');
};

function setupTabs(){
  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
      tab.classList.add('on');
      document.getElementById(tab.dataset.view).classList.add('on');
    };
  });
}

boot();
</script>
